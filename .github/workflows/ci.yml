name: CI

on:
  push:
    branches: [main]
  pull_request:
    # The acceptance-evidence check reads the pull request body, so it runs in pr-metadata.yml;
    # a body edit does not re-run this workflow.
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Workflow-level, not just on the build job: `svelte-kit sync` generates the
# types for `$env/static/public` from the environment, so without this
# svelte-check fails with "Module '$env/static/public' has no exported member
# PUBLIC_ENTRA_CLIENT_ID" even though the build would have been fine.
#
# The value is inert. The real client id is per-deployment config in Cloudflare
# Pages, and this app is client-side only with no server secrets.
env:
  PUBLIC_ENTRA_CLIENT_ID: 00000000-0000-0000-0000-000000000000

jobs:
  validate:
    name: Validate and build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: '1.59.0'

      - name: Install
        id: install
        run: pnpm install --frozen-lockfile

      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: just lint

      - name: Check formatting
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: just fmt-check

      # Vite strips types during build. Run Svelte and TypeScript checks explicitly.
      - name: Type check
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: just typecheck

      - name: Build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: just build

  # The lines a pull request adds carry no identifier, email address, public address or credential
  # shape. The reusable fails on any event but pull_request, so it runs on pull requests only.
  # Check run: `privacy-sweep / Privacy sweep`.
  privacy-sweep:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    uses: rknightion/.github/.github/workflows/privacy-sweep.yml@a6e7f83c8fd233841120fc14c0412124a445c306 # v1.35.0

  # zizmor fails a pull request on any finding (enforce); push runs upload SARIF instead.
  zizmor:
    permissions:
      contents: read
      security-events: write
      actions: read
    uses: rknightion/.github/.github/workflows/zizmor.yml@a6e7f83c8fd233841120fc14c0412124a445c306 # v1.35.0
    with:
      enforce: true

  # Single required check for the branch ruleset. Adding or renaming a job above
  # only needs updating here, not in the ruleset.
  ci-success:
    name: ci-success
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs: [validate, privacy-sweep, zizmor]
    # contents/pull-requests read: the folded backlog freeze step below lists the pull request's files.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Fail if any required job did not pass
        if: >-
          ${{
            needs.validate.result != 'success' || needs.zizmor.result != 'success'
            || contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
          }}
        run: |
          echo "A required job did not pass: ${{ join(needs.*.result, ', ') }}"
          exit 1
      # A skipped job reports success, so on a pull request the pull request checks must have
      # actually run and passed.
      - name: Fail if a pull request check did not run
        if: ${{ github.event_name == 'pull_request' }}
        env:
          PRIVACY_SWEEP: ${{ needs.privacy-sweep.result }}
        run: |
          if [[ "$PRIVACY_SWEEP" != "success" ]]; then
            echo "privacy-sweep: ${PRIVACY_SWEEP}; all must pass on a pull request"
            exit 1
          fi
      # The Backlog.md board is retired: issues are the queue. A pull request may delete files under
      # backlog/ or move them out, never add or change one there. Folded in here from its own job
      # (a 5 s job that cost a runner start); it still fails ci-success on any offending file. Reads the
      # file list from the API, so no pull request code is checked out.
      - name: Refuse additions and changes under backlog/
        if: ${{ always() && github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
        run: |
          set -euo pipefail
          if ! [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ && "$CHANGED_FILES" =~ ^[0-9]+$ ]]; then
            echo "::error title=backlog freeze::the pull request number or file count is malformed"
            exit 1
          fi
          # The pull request files API lists at most 3000 files; refuse rather than check part of a change.
          if (( CHANGED_FILES > 3000 )); then
            echo "::error title=backlog freeze::${CHANGED_FILES} changed files is more than the API lists; split the pull request"
            exit 1
          fi
          offending="$(gh api --paginate "repos/${REPO}/pulls/${PR_NUMBER}/files?per_page=100" \
            --jq '.[] | select(.status != "removed") | select(.filename | startswith("backlog/")) | "\(.status) \(.filename | @json)"')"
          if [[ -n "$offending" ]]; then
            echo "::error title=backlog freeze::this pull request adds or changes files under backlog/; the board is retired, so file the work as an issue"
            printf '  %s\n' "$offending"
            exit 1
          fi
          echo "No file under backlog/ is added or changed."
      - name: All required jobs passed
        run: echo "ci-success — ${{ join(needs.*.result, ', ') }}"
