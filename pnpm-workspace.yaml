# Supply-chain maturity window, in MINUTES. pnpm 11 defaults this to 1440 (24h)
# and ENFORCES it client-side: `pnpm install --frozen-lockfile` hard-fails with
# ERR_PNPM_MINIMUM_RELEASE_AGE_VIOLATION on a lockfile carrying anything younger.
#
# This is pinned to the fleet Renovate npm cooldown in m7kni/renovate-config
# (config.js, the `matchDatasources: ["npm"]` packageRule). The two MUST move
# together and this one must never be the higher of the pair: Renovate raises the
# PR on its own cooldown, then CI installs under this one, so a floor above the
# Renovate window produces PRs that are guaranteed to fail CI until they age out.
# That is not theoretical - it happened here on eslint@10.8.1 (2026-08-08) when
# the fleet cooldown was 12h against pnpm 11's untouched 1440.
minimumReleaseAge: 360

# pnpm 10+ reads project settings from here rather than package.json.

# strictDepBuilds defaults to true in pnpm 11, so every dependency wanting to run
# a postinstall script needs an explicit yes or no here or `pnpm install` fails.
# All three are denied: they ship prebuilt per-platform binaries as optional deps,
# and the production build is verified green without their scripts ever running.
# Denying keeps the postinstall attack surface at zero. Flip one to `true` only if
# a build actually breaks without it.
allowBuilds:
  esbuild: false
  sharp: false
  workerd: false

# postcss arrives transitively via the Vite/Tailwind toolchain, which still
# resolves <= 8.5.22. That range is GHSA-affected: an attacker-controlled
# sourceMappingURL can read arbitrary .map files when `from` is unset (an
# incomplete fix of GHSA-6g55-p6wh-862q). Dev-only and medium severity, but the
# override is free. Drop it once the toolchain's own range moves past 8.5.23.
overrides:
  postcss: '>=8.5.23'
